name: Quality checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lightweight test dependencies
        run: pip install numpy==2.2.6 pillow==11.3.0
      - name: Compile source
        run: python -m compileall -q scripts streamlit_app.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
